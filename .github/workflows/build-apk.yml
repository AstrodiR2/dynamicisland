name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Keep the signing key between runs
        uses: actions/cache@v4
        with:
          path: release-keys
          key: dynamicisland-keystore-v1
      - name: Build and sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dynamicisland-local' }}
        run: scripts/sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-apk
          path: release/*.apk
          retention-days: 14
